services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: netmap
      POSTGRES_PASSWORD: netmap
      POSTGRES_DB: netmap
    ports:
      - "5432:5432"
    volumes:
      - netmap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netmap_pgdata:
